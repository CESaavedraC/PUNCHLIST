<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5fd1"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Punchlist"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d5fd1">
<title>Punchlist Puertas MVS</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d9dde3;--ac:#1d5fd1;--red:#d92d20;--amb:#e8a300;--grn:#12a150;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e2229;--tx:#e8eaed;--mut:#98a2b3;--bd:#323944;--ac:#5b9bff;--red:#f97066;--amb:#f5b83d;--grn:#47cd89;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e2229;--tx:#e8eaed;--mut:#98a2b3;--bd:#323944;--ac:#5b9bff;--red:#f97066;--amb:#f5b83d;--grn:#47cd89;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
h1{font-size:17px;margin:0;flex:1;min-width:150px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:14px;max-width:1100px;margin:0 auto}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
.sum b{font-size:20px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mv{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--grn);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.mv.o{border-left-color:var(--red)}.mv.z{border-left-color:var(--bd)}
.mv h3{margin:0 0 4px;font-size:16px}.mut{color:var(--mut);font-size:13px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
.pcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.pc h3{margin:0 0 8px}
.door{display:block;width:100%;text-align:left;margin-top:6px;border-left:5px solid var(--grn)}
.door.o{border-left-color:var(--red)}.door.z{border-left-color:var(--bd)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ph img{width:84px;height:84px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--bd)}
.st{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}
.s-abierto{background:var(--red)}.s-proceso{background:var(--amb);color:#222}.s-cerrado{background:var(--grn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:60px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:20}
#lb img{max-width:96vw;max-height:92vh}
a.b{color:var(--ac);cursor:pointer}
.drow{display:flex;gap:6px;margin-top:6px}.drow .door{margin-top:0;flex:1}.cam{font-size:22px;padding:8px 14px}
.bn{background:var(--card);border-bottom:1px solid var(--bd);padding:6px 14px;font-size:12px;color:var(--mut)}.bn.w{color:var(--red);font-weight:600}
.k{cursor:pointer;border-color:var(--ac)!important}.ph img.big{width:100%;height:auto;max-height:60vh;object-fit:contain}
.report{background:#fff;color:#111;padding:16px;border:1px solid var(--bd);border-radius:8px;margin-top:12px;overflow-x:auto}.report table{border-collapse:collapse;width:100%;margin:8px 0}.report th,.report td{border:1px solid #a6a6a6;padding:5px 8px;text-align:left;font-size:13px;vertical-align:top}.report th{background:#d9e8f5}.report h3{color:#1f4e79;margin:16px 0 4px;font-size:15px}.report .ph2{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.report .ph2 img{width:48%;max-height:9cm;object-fit:contain}.report .ft{break-inside:avoid;margin-top:12px;font-size:13px}.rhd{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media print{header,#bn,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.report{border:0;padding:0;margin:0}}
</style>
</head>
<body>
<header>
<h1 id="ttl">Punchlist puertas · 25 MVS</h1>
<button id="rpb" onclick="showRep()">Informe</button><button id="exp">CSV</button><button id="bak">Guardar respaldo</button><select id="ql" title="Calidad de las fotos nuevas"><option value="s">Foto estándar</option><option value="a">Foto alta</option><option value="m">Foto máxima</option></select>
<button id="imp">Unir respaldos</button><input id="file" type="file" accept=".json,application/json" multiple hidden>
</header>
<div id="bn"></div>
<main id="app"></main>
<div id="lb" onclick="this.style.display='none'"><img id="lbi" alt=""></div>
<script>
const NMVS=25,NPCS=4,DOORS={F:'Frontal',P:'Posterior'};
const ST={abierto:'Abierto',proceso:'En proceso',cerrado:'Cerrado'};
let items=[],v={m:null,p:null,d:null},db=null,last=0,lf='p',opn=null;
const QS={s:[1280,.75],a:[1920,.85],m:[4000,.92]};let ql='a';try{ql=localStorage.getItem('pq')||'a'}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function idb(){return new Promise(r=>{try{const q=indexedDB.open('punchlist-mvs',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('it'))d.createObjectStore('it')};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r();q.onblocked=()=>r()}catch(e){r()}})}
const saved=new Map(),sig=i=>(i.u||i.f)+':'+i.s+':'+i.fo.length+':'+i.t.length;
function load(){return new Promise(r=>{if(!db)return r();let mig=false;try{const t=db.transaction(['kv','it']),k=t.objectStore('kv'),g=t.objectStore('it').getAll(),old=k.get('items'),l=k.get('last');g.onsuccess=()=>{items=g.result||[];items.forEach(i=>saved.set(i.id,sig(i)))};old.onsuccess=()=>{if(old.result&&old.result.length&&!items.length){items=old.result;mig=true}};l.onsuccess=()=>{last=l.result||0};t.oncomplete=()=>{const t2=save();if(mig&&t2)t2.oncomplete=()=>{try{db.transaction('kv','readwrite').objectStore('kv').delete('items')}catch(e){}};r()};t.onerror=()=>r();t.onabort=()=>r()}catch(e){r()}})}
function setLast(t){last=t;try{if(db)db.transaction('kv','readwrite').objectStore('kv').put(t,'last')}catch(e){}}
function banner(){const mb=(items.reduce((s,i)=>s+i.t.length+i.fo.reduce((a,f)=>a+f.length,0),0)/1048576).toFixed(1),nw=items.filter(i=>(i.u||i.f)>last).length,h=last?Math.round((Date.now()-last)/36e5):0;
 $('#bn').innerHTML=`<div class="bn ${db?'':'w'}">${db?'💾 Guardado en este teléfono':'⚠ Este navegador no permite guardar datos: respalda de inmediato y no cierres la página'} · ${mb} MB · ${nw} cambio(s) sin respaldar · último respaldo: ${last?'hace '+(h<48?h+' h':Math.round(h/24)+' d'):'nunca'}</div>`}
function save(){try{if(!db)return;const t=db.transaction('it','readwrite'),o=t.objectStore('it'),ids=new Set();t.onabort=()=>alert('No se pudo guardar (¿almacenamiento lleno?). Haz un respaldo ahora.');for(const i of items){ids.add(i.id);const g=sig(i);if(saved.get(i.id)!==g){o.put(i,i.id);saved.set(i.id,g)}}for(const k of [...saved.keys()])if(!ids.has(k)){o.delete(k);saved.delete(k)}return t}catch(e){console.error(e)}}
const cnt=(m,p,d)=>{const l=items.filter(i=>i.m==m&&(!p||i.p==p)&&(!d||i.d==d));return{t:l.length,o:l.filter(i=>i.s!='cerrado').length}};
function render(){render0();banner()}
function render0(){
 const a=$('#app');
 if(v.rep){repView(a);return}
 if(v.list){listView(a);return}
 if(!v.m){
  const all=cnt(),open=all.o;let dp=0;for(let m=1;m<=NMVS;m++)for(let p=1;p<=NPCS;p++)for(const d in DOORS)if(cnt(m,p,d).o)dp++;
  $('#ttl').textContent='Punchlist puertas · 25 MVS';
  let h=`<div class="sum"><div><b style="color:var(--grn)">${NMVS*NPCS*2-dp}</b>Puertas OK de ${NMVS*NPCS*2}</div><div class="k" onclick="showList('p')"><b style="color:var(--red)">${dp}</b>Puertas con pendientes ›</div><div class="k" onclick="showList('t')"><b>${all.t}</b>Observaciones ›</div><div class="k" onclick="showList('p')"><b style="color:var(--red)">${open}</b>Pendientes ›</div><div class="k" onclick="showList('c')"><b style="color:var(--grn)">${all.t-open}</b>Cerradas ›</div></div><div class="grid">`;
  for(let m=1;m<=NMVS;m++){const c=cnt(m);const pct=c.t?Math.round((c.t-c.o)/c.t*100):100;
   h+=`<button class="mv ${c.o?'o':''}" onclick="go(${m})"><h3>MVS ${String(m).padStart(2,'0')}</h3><div class="mut">${c.t?(c.o?c.o+' pendientes / '+c.t:'OK · '+c.t+' cerradas'):'OK · sin observaciones'}</div><div class="bar"><i style="width:${pct}%"></i></div></button>`}
  a.innerHTML=h+'</div>';
 }else if(!v.d){
  $('#ttl').textContent='MVS '+String(v.m).padStart(2,'0');
  let h=`<a class="b" onclick="go(null)">← Todas las MVS</a><div class="pcs">`;
  for(let p=1;p<=NPCS;p++){h+=`<div class="pc"><h3>PCS ${p}</h3>`;
   for(const d in DOORS){const c=cnt(v.m,p,d);
    h+=`<div class="drow"><button class="door ${c.o?'o':''}" onclick="door(${p},'${d}')"><b>Puerta ${DOORS[d]}</b><br><span class="mut">${c.t?(c.o?c.o+' pendientes / '+c.t:'OK · '+c.t+' cerradas'):'OK · sin observaciones'}</span></button><button class="cam" title="Foto" onclick="door(${p},'${d}',1)">📷</button></div>`}
   h+='</div>'}
  a.innerHTML=h+'</div>';
 }else{
  $('#ttl').textContent=`MVS ${String(v.m).padStart(2,'0')} · PCS ${v.p} · ${DOORS[v.d]}`;
  const l=items.filter(i=>i.m==v.m&&i.p==v.p&&i.d==v.d);
  let h=`<a class="b" onclick="go(${v.m})">← MVS ${String(v.m).padStart(2,'0')}</a>
  <div class="item"><b>Nueva observación</b><textarea id="tx" placeholder="Ej: bisagra suelta, falta sello, pintura dañada…"></textarea>
  <div class="row" style="margin-top:8px"><input id="ph" type="file" accept="image/*" capture="environment" multiple onchange="$('#pc').textContent=this.files.length+' foto(s) lista(s)'"><span id="pc" class="mut"></span><button class="p" onclick="add()">Agregar</button></div></div>`;
  for(const i of l){
   h+=`<div class="item"><div class="row"><span class="st s-${i.s}">${ST[i.s]}</span><span class="mut">${new Date(i.f).toLocaleString('es-CL')}</span><span style="flex:1"></span>
   <select onchange="setS('${i.id}',this.value)">${Object.keys(ST).map(k=>`<option value="${k}" ${k==i.s?'selected':''}>${ST[k]}</option>`).join('')}</select>
   <button onclick="del('${i.id}')">Eliminar</button></div><p>${esc(i.t)}</p>
   <div class="ph">${i.fo.map((f,n)=>`<img src="${f}" alt="foto" onclick="zoom('${i.id}',${n})">`).join('')}</div>
   <div class="row" style="margin-top:8px"><label class="mut">+ foto <input type="file" accept="image/*" capture="environment" multiple onchange="addPh('${i.id}',this.files)"></label></div></div>`}
  if(!l.length)h+='<p class="mut">Puerta OK: sin observaciones.</p>';
  a.innerHTML=h;
 }
}
function showList(f){lf=f||'p';opn=null;v={m:null,p:null,d:null,list:1};render();scrollTo(0,0)}
function tgl(id){opn=opn==id?null:id;render()}
function listView(a){
 $('#ttl').textContent='Lista de observaciones';
 const l=items.filter(i=>lf=='t'||(lf=='c'?i.s=='cerrado':i.s!='cerrado')).sort((x,y)=>x.m-y.m||x.p-y.p||x.d.localeCompare(y.d)||x.f-y.f);
 let h=`<div class="row"><a class="b" onclick="go(null)">← Todas las MVS</a><span style="flex:1"></span><select onchange="showList(this.value)">${[['p','Pendientes'],['c','Cerradas'],['t','Todas']].map(o=>`<option value="${o[0]}" ${o[0]==lf?'selected':''}>${o[1]}</option>`).join('')}</select></div><p class="mut">${l.length} observación(es)</p>`;
 for(const i of l){const o=opn==i.id;
  h+=`<div class="item" onclick="tgl('${i.id}')" style="cursor:pointer"><div class="row"><b>MVS ${String(i.m).padStart(2,'0')} · PCS ${i.p} · ${DOORS[i.d]}</b><span class="st s-${i.s}">${ST[i.s]}</span><span style="flex:1"></span><span class="mut">${i.fo.length?'📷 '+i.fo.length:'sin foto'} ${o?'▲':'▼'}</span></div><div style="margin-top:4px">${esc(i.t)}</div>`;
  if(o)h+=`<div class="ph">${i.fo.map((f,n)=>`<img class="big" src="${f}" alt="foto" onclick="event.stopPropagation();zoom('${i.id}',${n})">`).join('')}</div><div class="row" style="margin-top:8px"><button onclick="event.stopPropagation();v={m:${i.m},p:${i.p},d:'${i.d}'};render();scrollTo(0,0)">Abrir puerta</button></div>`;
  h+='</div>'}
 if(!l.length)h+='<p class="mut">No hay observaciones en esta lista.</p>';

const z2=x=>String(x).padStart(2,'0');
function hoy(){const t=new Date();return t.getFullYear()+'-'+z2(t.getMonth()+1)+'-'+z2(t.getDate())}
function showRep(){if(!rp.f)rp.f=hoy();v={m:null,p:null,d:null,rep:1};render();scrollTo(0,0)}
function rset(k,x){rp[k]=x;try{localStorage.setItem('rp',JSON.stringify({p:rp.p,w:rp.w,c:rp.c}))}catch(e){}$('#rv').innerHTML=reportHTML()}
function rpData(){const d0=new Date(rp.f+'T00:00:00').getTime(),d1=d0+864e5,inD=t=>t>=d0&&t<d1;
 const l=(rp.a=='p'?items.filter(i=>i.s!='cerrado'):items.filter(i=>inD(i.f)||inD(i.u||i.f))).sort((x,y)=>x.m-y.m||x.p-y.p||x.d.localeCompare(y.d)||x.f-y.f);
 let dp=0;for(let m=1;m<=NMVS;m++)for(let p=1;p<=NPCS;p++)for(const k in DOORS)if(cnt(m,p,k).o)dp++;
 const tot=NMVS*NPCS*2,ab=l.filter(i=>i.s!='cerrado').length;
 const F=new Date(rp.f+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 return{l,tot,dp,ab,F,
  info:[['Fecha',F],['N° de informe',rp.n||'—'],['Proyecto / servicio',rp.p||'—'],['Redactado por',rp.w||'—'],['Cargo',rp.c||'—'],['Alcance',rp.a=='p'?'Todas las observaciones pendientes':'Observaciones registradas o modificadas en la fecha']],
  res:[['Puertas totales (25 MVS × 4 PCS × 2 puertas)',tot],['Puertas OK (sin pendientes)',tot-dp],['Puertas con pendientes',dp],['Observaciones en este informe',l.length],['Abiertas / en proceso',ab],['Cerradas',l.length-ab]]}}
const lbl=i=>`MVS ${z2(i.m)} · PCS ${i.p} · ${DOORS[i.d]}`;
function reportHTML(){const D=rpData(),T=r=>`<table>${r.map(x=>`<tr><th style="width:42%">${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join('')}</table>`;
 let h=`<div class="report"><div class="rhd"><img src="${LOGO}" alt="Trina Storage" style="height:46px"><div style="text-align:right"><b style="font-size:18px;color:#1f4e79">INFORME DIARIO</b><br><span style="font-size:12px">Punchlist de puertas PCS</span></div></div>
 ${T(D.info)}<h3>1. Resumen</h3>${T(D.res)}<h3>2. Detalle de observaciones</h3>`;
 if(!D.l.length)h+='<p>Sin observaciones registradas en esta fecha.</p>';
 else h+=`<table><tr><th>N°</th><th>MVS</th><th>PCS</th><th>Puerta</th><th>Observación</th><th>Estado</th></tr>${D.l.map((i,n)=>`<tr><td>${n+1}</td><td>${z2(i.m)}</td><td>${i.p}</td><td>${DOORS[i.d]}</td><td>${esc(i.t)}</td><td>${ST[i.s]}</td></tr>`).join('')}</table>`;
 h+='<h3>3. Registro fotográfico</h3>';
 const cf=D.l.map((i,n)=>[i,n+1]).filter(x=>x[0].fo.length);
 if(!cf.length)h+='<p>Sin fotos en este informe.</p>';
 for(const [i,n] of cf)h+=`<div class="ft"><b>${n}. ${lbl(i)}</b> — ${esc(i.t)} (${ST[i.s]})<div class="ph2">${i.fo.map(f=>`<img src="${f}" alt="foto">`).join('')}</div></div>`;
 return h+'</div>'}

 a.innerHTML=`<a class="b noprint" onclick="go(null)">← Todas las MVS</a>
 <div class="item noprint"><b>Datos del informe</b>
 <div class="row" style="margin-top:8px"><label>Fecha <input type="date" value="${rp.f}" onchange="rset('f',this.value)"></label><label>N° informe <input value="${esc(rp.n)}" size="6" onchange="rset('n',this.value)"></label></div>
 <div class="row" style="margin-top:8px"><input placeholder="Proyecto / servicio" value="${esc(rp.p)}" onchange="rset('p',this.value)" style="flex:1;min-width:220px"></div>
 <div class="row" style="margin-top:8px"><input placeholder="Redactado por" value="${esc(rp.w)}" onchange="rset('w',this.value)"><input placeholder="Cargo" value="${esc(rp.c)}" onchange="rset('c',this.value)"></div>
 <div class="row" style="margin-top:8px"><select onchange="rset('a',this.value)"><option value="d" ${rp.a=='d'?'selected':''}>Observaciones del día</option><option value="p" ${rp.a=='p'?'selected':''}>Todas las pendientes</option></select></div>
 <div class="row" style="margin-top:10px"><button class="p" onclick="repDocx(this)">Descargar Word (.docx)</button><button onclick="window.print()">Imprimir / PDF</button></div></div>
 <div id="rv">${reportHTML()}</div>`}
async function repDocx(btn){const t=btn.textContent;btn.disabled=true;btn.textContent='Generando…';
 try{const b=await buildDocx();await dl(`Informe_Punchlist_${rp.f}${rp.n?'_N'+rp.n.replace(/[^\w-]+/g,''):''}.docx`,b)}catch(e){alert('No se pudo generar el Word: '+(e.message||e))}
 btn.disabled=false;btn.textContent=t}
const XM=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const b64=s=>{const b=atob(s.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const dim=src=>new Promise(r=>{const i=new Image();i.onload=()=>r([i.naturalWidth,i.naturalHeight]);i.onerror=()=>r([4,3]);i.src=src});
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipBlob(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 for(const f of files){const nm=enc.encode(f.n),d=f.d,crc=crc32(d),h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(h.buffer),nm,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
 let cl=0;cen.forEach(x=>cl+=x.length);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
async function buildDocx(){
 const D=rpData(),files=[],rels=[];let n=0;
 const addImg=async src=>{n++;const png=src.startsWith('data:image/png'),nm='media/img'+n+(png?'.png':'.jpg');files.push({n:'word/'+nm,d:b64(src)});rels.push(`<Relationship Id="rId${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${nm}"/>`);const[w,h]=await dim(src);return{rid:'rId'+n,w,h,id:n}};
 const run=(t,o={})=>`<w:r><w:rPr>${o.b?'<w:b/>':''}${o.c?`<w:color w:val="${o.c}"/>`:''}<w:sz w:val="${o.s||20}"/></w:rPr><w:t xml:space="preserve">${XM(t)}</w:t></w:r>`;
 const para=(c,o={})=>`<w:p><w:pPr>${o.k?'<w:keepNext/>':''}<w:spacing w:before="${o.sb==null?60:o.sb}" w:after="${o.sa==null?60:o.sa}"/>${o.j?`<w:jc w:val="${o.j}"/>`:''}</w:pPr>${c}</w:p>`;
 const cell=(c,w,fill)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:''}</w:tcPr>${c||'<w:p/>'}</w:tc>`;
 const tbl=(rows,ws,bd=true)=>`<w:tbl><w:tblPr><w:tblW w:w="${ws.reduce((a,b)=>a+b,0)}" w:type="dxa"/>${bd?`<w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="A6A6A6"/>`).join('')}</w:tblBorders>`:''}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${ws.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r}</w:tr>`).join('')}</w:tbl>`;
 const pic=(im,bw,bh)=>{const k=Math.min(bw/im.w,bh/im.h),w=Math.round(im.w*k),h=Math.round(im.h*k);return`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${w}" cy="${h}"/><wp:docPr id="${im.id}" name="img${im.id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${im.id}" name="img${im.id}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${im.rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${w}" cy="${h}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`};
 const kv=r=>tbl(r.map(x=>cell(para(run(x[0],{b:1})),3400,'D9E8F5')+cell(para(run(String(x[1]))),6238)),[3400,6238]);
 const H=t=>para(run(t,{b:1,c:'1F4E79',s:26}),{k:1,sb:240,sa:80});
 const sp=para('',{sb:0,sa:0});
 const lg=await addImg(LOGO),LCM=360000;
 let b=tbl([cell(para(pic(lg,Math.round(4.2*LCM),Math.round(1.4*LCM))),3000)+cell(para(run('INFORME DIARIO',{b:1,c:'1F4E79',s:36}),{j:'right',sa:0})+para(run('Punchlist de puertas PCS',{s:20}),{j:'right',sb:0}),6638)],[3000,6638],false)+sp+kv(D.info)+H('1. Resumen')+kv(D.res)+H('2. Detalle de observaciones');
 if(!D.l.length)b+=para(run('Sin observaciones registradas en esta fecha.'));
 else{const W=[600,800,800,1300,4138,2000];b+=tbl([['N°','MVS','PCS','Puerta','Observación','Estado'].map((t,q)=>cell(para(run(t,{b:1})),W[q],'BDD7EE')).join('')].concat(D.l.map((i,k)=>[String(k+1),z2(i.m),String(i.p),DOORS[i.d],i.t,ST[i.s]].map((t,q)=>cell(para(run(t)),W[q])).join(''))),W)}
 b+=sp+H('3. Registro fotográfico');
 const cf=D.l.map((i,k)=>[i,k+1]).filter(x=>x[0].fo.length);
 if(!cf.length)b+=para(run('Sin fotos en este informe.'));
 for(const[i,k]of cf){
  b+=para(run(`${k}. ${lbl(i)}`,{b:1})+run(` — ${i.t} (${ST[i.s]})`),{k:1,sb:200});
  const ims=[];for(const f of i.fo)ims.push(await addImg(f));
  const rows=[];for(let q=0;q<ims.length;q+=2){rows.push([ims[q],ims[q+1]].map(im=>cell(im?para(pic(im,Math.round(7.8*LCM),Math.round(8.5*LCM)),{j:'center'}):'',4819)).join(''))}
  b+=tbl(rows,[4819,4819],false)+sp}
 const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
 const E=new TextEncoder(),hd='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 files.unshift({n:'[Content_Types].xml',d:E.encode(hd+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')},
  {n:'_rels/.rels',d:E.encode(hd+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')},
  {n:'word/document.xml',d:E.encode(doc)},
  {n:'word/_rels/document.xml.rels',d:E.encode(hd+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.join('')+'</Relationships>')});
 return zipBlob(files)}
function go(m){v={m,p:null,d:null};render();scrollTo(0,0)}
function door(p,d,c){v.p=p;v.d=d;render();scrollTo(0,0);if(c){const e=$('#ph');if(e)e.click()}}
function shrink(f){return new Promise(r=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,QS[ql][0]/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',QS[ql][1]))};im.onerror=()=>r(null);im.src=u})}
async function photos(fs){const o=[];for(const f of fs){const d=await shrink(f);if(d)o.push(d)}return o}
async function add(){
 const t=$('#tx').value.trim(),fs=$('#ph').files;
 if(!t&&!fs.length)return;
 const fo=await photos(fs);
 items.unshift({id:uid(),m:v.m,p:v.p,d:v.d,t:t||'(sin descripción)',s:'abierto',f:Date.now(),u:Date.now(),fo});
 save();render();
}
async function addPh(id,fs){const i=items.find(x=>x.id==id);i.fo.push(...await photos(fs));i.u=Date.now();save();render()}
const uid=()=>'i'+Date.now()+Math.random().toString(36).slice(2,6);
function setS(id,s){const i=items.find(x=>x.id==id);i.s=s;i.u=Date.now();save();render()}
function del(id){if(confirm('¿Eliminar esta observación y sus fotos?')){items=items.filter(x=>x.id!=id);save();render()}}
function zoom(id,n){$('#lbi').src=items.find(x=>x.id==id).fo[n];$('#lb').style.display='flex'}
async function dl(name,data){try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:name,data});return true}}catch(e){if(e&&e.code=='declined')return false}
 const f=new File([data],name,{type:name.endsWith('.docx')?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':name.endsWith('.csv')?'text/csv':'application/json'});
 try{if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name=='AbortError')return false}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
$('#exp').onclick=()=>{
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 let c='\ufeffMVS,PCS,Puerta,Observación,Estado,Fecha,N° fotos\n';
 [...items].sort((a,b)=>a.m-b.m||a.p-b.p||a.d.localeCompare(b.d)).forEach(i=>c+=[i.m,i.p,DOORS[i.d],q(i.t),ST[i.s],new Date(i.f).toLocaleDateString('es-CL'),i.fo.length].join(',')+'\n');
 dl('punchlist.csv',c)};
$('#bak').onclick=async()=>{const nw=items.filter(i=>(i.u||i.f)>last);let sel=items,tag='completo';
 if(last&&nw.length&&nw.length<items.length&&confirm(`Aceptar = solo los ${nw.length} cambios nuevos desde el último respaldo (archivo más liviano).\nCancelar = respaldo completo.`)){sel=nw;tag='nuevos'}
 const n=(prompt('Nombre del equipo o persona (va en el nombre del archivo):','')||'equipo').replace(/[^\w-]+/g,'-'),t=new Date(),z=x=>String(x).padStart(2,'0');
 if(await dl(`punchlist_${n}_${tag}_${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())}_${z(t.getHours())}${z(t.getMinutes())}.json`,JSON.stringify(sel))){setLast(Date.now());banner()}};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{let nw=0,mg=0;try{for(const f of e.target.files){const d=JSON.parse(await f.text());if(!Array.isArray(d))continue;for(const x of d){const o=items.find(i=>i.id==x.id);if(!o){items.push(x);nw++}else{const a=(x.u||x.f)>(o.u||o.f),w=a?x:o,l=a?o:x;w.fo=[...new Set([...w.fo,...l.fo])];items[items.indexOf(o)]=w;mg++}}}save();render();alert(`Unión lista: ${nw} observaciones nuevas, ${mg} ya existían (se conservó la versión más reciente y se juntaron las fotos).`)}catch(x){alert('Archivo inválido')}e.target.value=''};
$('#ql').value=ql;$('#ql').onchange=e=>{ql=e.target.value;try{localStorage.setItem('pq',ql)}catch(x){}};
idb().then(load).then(render);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
